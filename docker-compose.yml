services:
  service:
    build: ../school-service
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  worker:
    build: ../school-worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      service: { condition: service_started }
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
  frontend:
    image: nginx:alpine
    volumes: ["../school-frontend:/usr/share/nginx/html:ro"]
    ports: ["8090:80"]
  admin:
    image: nginx:alpine
    volumes: ["../school-admin:/usr/share/nginx/html:ro"]
    ports: ["8091:80"]
volumes:
  postgres_data:
services:
  service:
    build: ../school-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_ENV: ${APP_ENV:-production}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: ../school-worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_ENV: ${APP_ENV:-production}
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - ../school-frontend:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    restart: unless-stopped

  admin:
    image: nginx:alpine
    volumes:
      - ../school-admin:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    restart: unless-stopped
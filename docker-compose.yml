services:
  service:
    build: ../school-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: ../school-worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      - redis
      - service
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  frontend:
    image: nginx:alpine
    volumes:
      - ../school-frontend:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    restart: unless-stopped

  admin:
    image: nginx:alpine
    volumes:
      - ../school-admin:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  redis_data:
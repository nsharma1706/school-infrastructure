name: Deploy Production to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER: school-prod
  NAMESPACE: prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/app.yaml

      - name: Refresh production images
        run: |
          kubectl rollout restart deployment/school-service -n "$NAMESPACE"
          kubectl rollout restart deployment/school-worker -n "$NAMESPACE"
          kubectl rollout restart deployment/school-frontend -n "$NAMESPACE"
          kubectl rollout restart deployment/school-admin -n "$NAMESPACE"

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/school-service -n "$NAMESPACE" --timeout=5m
          kubectl rollout status deployment/school-worker -n "$NAMESPACE" --timeout=5m
          kubectl rollout status deployment/school-frontend -n "$NAMESPACE" --timeout=5m
          kubectl rollout status deployment/school-admin -n "$NAMESPACE" --timeout=5m
